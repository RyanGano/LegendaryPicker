name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Show .NET SDK
        run: dotnet --version
      - name: Run service tests
        run: dotnet test LegendaryPicker.slnx --logger "console;verbosity=detailed"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LegendaryPickerApp/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: LegendaryPickerApp
      - name: Lint frontend
        run: npm run lint
        working-directory: LegendaryPickerApp
      - name: Build frontend
        run: npm run build
        working-directory: LegendaryPickerApp
